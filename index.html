<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fábrica Livre Studio</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f111a', 800: '#151923', 700: '#1e2330', 600: '#2c3344', border: '#2a3140' },
                        brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f111a; color: #f8fafc; margin: 0; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        .editor-textarea { tab-size: 2; font-family: 'Fira Code', monospace; }
        .glass { background: rgba(21, 25, 35, 0.7); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useContext, createContext, useRef } = React;
        const GROQ_API_KEY = "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";

        // ==========================================
        // CONTEXTOS GLOBAIS
        // ==========================================
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [credits, setCredits] = useState(500);
            const [projects, setProjects] = useState([]);
            const [currentRoute, setCurrentRoute] = useState('login'); 
            const [activeProject, setActiveProject] = useState(null);
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const login = () => { 
                setUser({ name: 'Marcelo Trader', plan: 'PRO', email: 'admin@fabricalivre.com' }); 
                setCurrentRoute('dashboard'); 
                showToast('Login realizado com sucesso!', 'success'); 
            };
            const logout = () => { setUser(null); setCurrentRoute('login'); };

            return (
                <AppContext.Provider value={{ user, login, logout, credits, setCredits, projects, setProjects, currentRoute, setCurrentRoute, activeProject, setActiveProject, showToast, toast }}>
                    {children}
                </AppContext.Provider>
            );
        };

        // ==========================================
        // COMPONENTES DE UI REUTILIZÁVEIS
        // ==========================================
        const Button = ({ children, onClick, variant = 'primary', className = '', icon, disabled }) => {
            const base = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-brand-600 hover:bg-brand-500 text-white shadow-lg shadow-brand-500/20",
                secondary: "bg-dark-700 hover:bg-dark-600 border border-dark-border text-slate-200",
                danger: "bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30",
                ghost: "hover:bg-dark-700 text-slate-400 hover:text-white"
            };
            return <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>{icon && <i className={`fa-solid ${icon}`}></i>}{children}</button>;
        };

        const Toast = ({ toast }) => {
            if (!toast) return null;
            const colors = { success: 'border-green-500/50 bg-green-500/10 text-green-400', error: 'border-red-500/50 bg-red-500/10 text-red-400', info: 'border-brand-500/50 bg-brand-500/10 text-brand-400' };
            return (
                <div className={`fixed bottom-4 right-4 z-50 px-4 py-3 rounded-xl border backdrop-blur-md shadow-2xl fade-in flex items-center gap-3 ${colors[toast.type]}`}>
                    <i className={`fa-solid ${toast.type === 'success' ? 'fa-check-circle' : toast.type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle'}`}></i>
                    <span className="text-sm font-medium">{toast.msg}</span>
                </div>
            );
        };

        // ==========================================
        // TELAS DA APLICAÇÃO
        // ==========================================

        const LoginView = () => {
            const { login } = useContext(AppContext);
            return (
                <div className="h-screen flex items-center justify-center bg-dark-900 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                    <div className="w-full max-w-md p-8 glass border border-dark-border rounded-2xl shadow-2xl text-center fade-in">
                        <div className="w-16 h-16 bg-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-brand-500/30">
                            <i className="fa-solid fa-code text-3xl text-white"></i>
                        </div>
                        <h1 className="text-2xl font-bold text-white mb-2">Fábrica Livre Studio</h1>
                        <p className="text-slate-400 text-sm mb-8">AI App Builder Profissional</p>
                        <Button onClick={login} className="w-full" icon="fa-google">Acessar Workspace</Button>
                    </div>
                </div>
            );
        };

        const Sidebar = () => {
            const { setCurrentRoute, currentRoute, logout, credits } = useContext(AppContext);
            const navItems = [
                { id: 'dashboard', icon: 'fa-house', label: 'Dashboard' },
                { id: 'settings', icon: 'fa-gear', label: 'Configurações' },
            ];

            return (
                <div className="w-64 bg-dark-800 border-r border-dark-border flex flex-col shrink-0">
                    <div className="p-6 border-b border-dark-border flex items-center gap-3">
                        <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center shadow-lg"><i className="fa-solid fa-code text-white text-xs"></i></div>
                        <div>
                            <h2 className="font-bold text-white tracking-tight">Fábrica Livre</h2>
                            <p className="text-[10px] text-brand-400 font-mono">STUDIO v2.5</p>
                        </div>
                    </div>
                    
                    <div className="flex-1 py-6 px-4 space-y-2">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => setCurrentRoute(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${currentRoute === item.id ? 'bg-brand-600 text-white shadow-lg shadow-brand-500/20' : 'text-slate-400 hover:bg-dark-700 hover:text-white'}`}>
                                <i className={`fa-solid ${item.icon} w-5 text-center`}></i> {item.label}
                            </button>
                        ))}
                    </div>

                    <div className="p-4 border-t border-dark-border bg-dark-900/50">
                        <div className="bg-dark-700 border border-dark-border rounded-xl p-4 mb-4">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-xs text-slate-400">Energia da IA</span>
                                <span className="text-xs font-bold text-yellow-400"><i className="fa-solid fa-bolt mr-1"></i>{credits}</span>
                            </div>
                        </div>
                        <button onClick={logout} className="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-sm text-red-400 hover:bg-red-500/10 transition-colors">
                            <i className="fa-solid fa-right-from-bracket w-5 text-center"></i> Sair
                        </button>
                    </div>
                </div>
            );
        };

        const DashboardView = () => {
            const { projects, setProjects, setCurrentRoute, setActiveProject, showToast } = useContext(AppContext);
            const [showNewModal, setShowNewModal] = useState(false);
            const [prompt, setPrompt] = useState('');
            const [step, setStep] = useState('input'); // input, planning

            const handleCreateProject = async () => {
                setStep('planning');
                try {
                    const systemPrompt = `Você é um Arquiteto de Software autônomo. Crie a estrutura inicial para este projeto: "${prompt}".
                    Retorne APENAS um código React (App.jsx) funcional e bonito usando Tailwind CSS.
                    Não use formatação markdown (\`\`\`jsx), entregue apenas o código cru.`;

                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
                        body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: systemPrompt }] })
                    });
                    
                    const data = await res.json();
                    let code = data.choices[0].message.content.replace(/```jsx/g, '').replace(/```javascript/g, '').replace(/```html/g, '').replace(/```/g, '').trim();

                    const newProj = {
                        id: Date.now().toString(),
                        name: "App_" + Math.floor(Math.random() * 10000),
                        desc: prompt,
                        status: 'development',
                        version: 1,
                        updatedAt: new Date().toLocaleTimeString(),
                        chat: [{ role: 'ai', content: 'Arquitetura montada com sucesso! O que deseja modificar neste projeto?' }],
                        vfs: {
                            'src/App.jsx': code,
                            'src/styles.css': `/* Estilos base carregados */\nbody { margin: 0; }`,
                        }
                    };
                    
                    setProjects([newProj, ...projects]);
                    setActiveProject(newProj);
                    setCurrentRoute('ide');
                    showToast('Projeto criado pela IA.', 'success');
                } catch (e) {
                    setStep('input');
                    showToast('Erro ao conectar com a Groq API.', 'error');
                }
            };

            return (
                <div className="flex-1 flex flex-col bg-dark-900 overflow-y-auto fade-in">
                    <div className="p-8 max-w-6xl mx-auto w-full">
                        <div className="flex justify-between items-end mb-8">
                            <div>
                                <h1 className="text-3xl font-bold text-white mb-2">Workspace</h1>
                                <p className="text-slate-400 text-sm">Gerencie seus projetos e deployments em tempo real.</p>
                            </div>
                            <Button onClick={() => setShowNewModal(true)} icon="fa-plus">Novo Projeto</Button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                            {[ { label: 'Em Desenvolvimento', val: projects.length, icon: 'fa-laptop-code', color: 'text-brand-400' },
                               { label: 'Publicados', val: '0', icon: 'fa-cloud-arrow-up', color: 'text-emerald-400' }
                            ].map((stat, i) => (
                                <div key={i} className="bg-dark-800 border border-dark-border rounded-2xl p-6 flex items-center gap-4">
                                    <div className={`w-12 h-12 rounded-xl bg-dark-900 border border-dark-border flex items-center justify-center ${stat.color} text-xl`}><i className={`fa-solid ${stat.icon}`}></i></div>
                                    <div><p className="text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">{stat.label}</p><h3 className="text-2xl font-bold text-white">{stat.val}</h3></div>
                                </div>
                            ))}
                        </div>

                        <h2 className="text-lg font-bold text-white mb-4 border-b border-dark-border pb-2">Projetos Ativos</h2>
                        
                        {projects.length === 0 ? (
                            <div className="text-center py-20 border border-dashed border-dark-border rounded-2xl bg-dark-800/50">
                                <div className="w-16 h-16 bg-dark-700 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-folder-open text-2xl text-slate-500"></i></div>
                                <h3 className="text-white font-bold mb-2">Nenhum projeto encontrado</h3>
                                <Button onClick={() => setShowNewModal(true)} icon="fa-wand-magic-sparkles">Gerar com IA</Button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {projects.map(p => (
                                    <div key={p.id} className="bg-dark-800 border border-dark-border rounded-2xl p-5 hover:border-brand-500 transition-colors group cursor-pointer" onClick={() => { setActiveProject(p); setCurrentRoute('ide'); }}>
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="w-10 h-10 rounded-lg bg-dark-700 flex items-center justify-center text-brand-400"><i className="fa-brands fa-react"></i></div>
                                            <span className="text-[10px] font-mono bg-dark-900 border border-dark-border text-slate-400 px-2 py-1 rounded">v{p.version}.0</span>
                                        </div>
                                        <h3 className="text-white font-bold text-lg mb-1 group-hover:text-brand-400">{p.name}</h3>
                                        <p className="text-slate-500 text-xs mb-4 line-clamp-2">{p.desc}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {showNewModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-dark-800 border border-dark-border rounded-2xl max-w-2xl w-full p-6 shadow-2xl">
                                {step === 'input' ? (
                                    <>
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="fa-solid fa-wand-magic-sparkles text-brand-400"></i> Criar SaaS</h2>
                                            <button onClick={() => setShowNewModal(false)} className="text-slate-500 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                        </div>
                                        <textarea value={prompt} onChange={e=>setPrompt(e.target.value)} className="w-full h-32 bg-dark-900 border border-dark-border rounded-xl p-4 text-white text-sm focus:border-brand-500 outline-none resize-none mb-4" placeholder="Descreva sua aplicação..."></textarea>
                                        <div className="flex justify-end gap-3"><Button variant="ghost" onClick={() => setShowNewModal(false)}>Cancelar</Button><Button onClick={handleCreateProject} disabled={!prompt}>Gerar Código Fonte</Button></div>
                                    </>
                                ) : (
                                    <div className="text-center py-10">
                                        <i className="fa-solid fa-microchip text-4xl text-brand-500 animate-pulse mb-4"></i>
                                        <h2 className="text-xl font-bold text-white mb-2">Groq AI Trabalhando</h2>
                                        <p className="text-slate-400 text-sm">Gerando componentes, roteamento e estilos...</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ProjectWorkspaceView = () => {
            const { activeProject, setCurrentRoute, setCredits, showToast } = useContext(AppContext);
            const [vfs, setVfs] = useState(activeProject.vfs);
            const [activeFile, setActiveFile] = useState('src/App.jsx');
            const [previewKey, setPreviewKey] = useState(0);
            const [chat, setChat] = useState(activeProject.chat);
            const [chatInput, setChatInput] = useState('');
            const [agentStatus, setAgentStatus] = useState('idle');
            const [terminalLogs, setTerminalLogs] = useState([{ time: new Date().toLocaleTimeString(), msg: 'Build Inicializada...', type: 'info' }]);
            const [lastError, setLastError] = useState('');

            const addLog = (msg, type = 'info') => setTerminalLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg, type }]);

            const compiledHtml = `
            <!DOCTYPE html>
            <html lang="pt-BR">
            <head>
                <script src="https://cdn.tailwindcss.com"><\/script>
                <script src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
                <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
                <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                <style>${vfs['src/styles.css'] || ''}</style>
                <script>
                    window.onerror = function(msg, url, line) {
                        window.parent.postMessage({ type: 'ERROR', msg: msg + ' (Linha ' + line + ')' }, '*');
                        return false;
                    };
                <\/script>
            </head>
            <body class="bg-slate-100 text-slate-900 antialiased">
                <div id="root"></div>
                <script type="text/babel" data-type="module">
                    ${vfs['src/App.jsx'] || ''}
                    try {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(<App />);
                        window.parent.postMessage({ type: 'SUCCESS', msg: 'Renderização concluída.' }, '*');
                    } catch(e) { window.parent.postMessage({ type: 'ERROR', msg: e.message }, '*'); }
                <\/script>
            </body>
            </html>`;

            useEffect(() => {
                const handleMessage = (e) => {
                    if (e.data && e.data.type === 'ERROR') {
                        addLog(`Erro no Preview: ${e.data.msg}`, 'error');
                        setLastError(e.data.msg);
                    }
                    if (e.data && e.data.type === 'SUCCESS') addLog(`Preview atualizado.`, 'success');
                };
                window.addEventListener('message', handleMessage);
                return () => window.removeEventListener('message', handleMessage);
            }, []);

            const handleFileChange = (e) => setVfs({ ...vfs, [activeFile]: e.target.value });
            const triggerRebuild = () => setPreviewKey(prev => prev + 1);

            // INTEGRAÇÃO REAL DA GROQ NO CHAT DA IDE
            const handleSendMessage = async () => {
                if(!chatInput.trim()) return;
                const userMsg = chatInput;
                setChat([...chat, { role: 'user', content: userMsg }]);
                setChatInput('');
                setCredits(prev => prev - 10);
                setAgentStatus('analyzing');
                addLog(`Agente analisando pedido...`, 'info');

                try {
                    const systemPrompt = `Você é um Engenheiro de Software Full-Stack.
                    Modifique ou adicione código ao arquivo atual baseado no pedido: "${userMsg}".
                    Código atual de App.jsx:\n${vfs['src/App.jsx']}\n
                    REGRA MÁXIMA: Retorne APENAS o código React cru completo e atualizado. Sem blocos markdown (\`\`\`jsx). Use Tailwind CSS.`;

                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
                        body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: systemPrompt }] })
                    });
                    
                    const data = await res.json();
                    let newCode = data.choices[0].message.content.replace(/```jsx/g, '').replace(/```javascript/g, '').replace(/```/g, '').trim();

                    setVfs(prev => ({ ...prev, 'src/App.jsx': newCode }));
                    setChat(prev => [...prev, { role: 'ai', content: 'Apliquei as alterações solicitadas no código. Verifique o Preview.' }]);
                    setAgentStatus('idle');
                    addLog('Código atualizado pela IA.', 'success');
                    triggerRebuild();
                } catch (e) {
                    setAgentStatus('idle');
                    addLog('Falha na comunicação com a API.', 'error');
                }
            };

            // INTEGRAÇÃO DE AUTOCORREÇÃO
            const triggerAutoCorrection = async () => {
                if(!lastError) return showToast('Nenhum erro detectado no momento.', 'info');
                addLog('Iniciando Autocorreção...', 'info');
                setAgentStatus('analyzing');
                
                try {
                    const prompt = `O código falhou com este erro: "${lastError}".
                    Código atual:\n${vfs['src/App.jsx']}\n
                    Corrija o erro e retorne APENAS o código React JSX corrigido, sem formatação markdown.`;

                    const res = await fetch("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
                        body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: prompt }] })
                    });
                    
                    const data = await res.json();
                    let correctedCode = data.choices[0].message.content.replace(/```jsx/g, '').replace(/```javascript/g, '').replace(/```/g, '').trim();
                    
                    setVfs(prev => ({ ...prev, 'src/App.jsx': correctedCode }));
                    setAgentStatus('idle');
                    addLog('Patch de correção aplicado pela IA.', 'success');
                    triggerRebuild();
                    setLastError('');
                } catch(e) {
                    setAgentStatus('idle');
                    addLog('Falha na autocorreção.', 'error');
                }
            };

            return (
                <div className="flex-1 flex flex-col h-full bg-dark-900 fade-in overflow-hidden">
                    <div className="h-14 bg-dark-800 border-b border-dark-border flex items-center justify-between px-4 shrink-0">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setCurrentRoute('dashboard')} className="text-slate-400 hover:text-white"><i className="fa-solid fa-arrow-left"></i></button>
                            <div>
                                <h2 className="text-white font-bold text-sm">{activeProject.name}</h2>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <Button variant="secondary" icon="fa-github" onClick={()=>showToast('Conecte no painel Configurações', 'info')}>Exportar Source</Button>
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        {/* PAINEL ESQUERDO: CHAT & ARQUIVOS */}
                        <div className="w-[350px] bg-dark-800 border-r border-dark-border flex flex-col shrink-0">
                            <div className="h-1/4 border-b border-dark-border flex flex-col">
                                <div className="px-4 py-2 text-xs font-bold text-slate-400 uppercase bg-dark-900/50">Files</div>
                                <div className="flex-1 overflow-y-auto p-2">
                                    {Object.keys(vfs).map(file => (
                                        <div key={file} onClick={() => setActiveFile(file)} className={`text-xs flex items-center gap-2 px-2 py-1.5 ml-2 rounded cursor-pointer ${activeFile === file ? 'bg-brand-600/20 text-brand-400' : 'text-slate-400 hover:bg-dark-700 hover:text-slate-200'}`}>
                                            <i className={`fa-brands ${file.includes('jsx') ? 'fa-react text-brand-500' : 'fa-css3 text-blue-400'}`}></i> {file.replace('src/', '')}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="flex-1 flex flex-col bg-dark-900/30">
                                <div className="px-4 py-2 text-xs font-bold text-slate-400 bg-dark-900/50 flex justify-between">
                                    <span>AGENTE PROMPTSYS</span>
                                    {agentStatus !== 'idle' && <span className="text-brand-400 normal-case"><i className="fa-solid fa-circle-notch fa-spin mr-1"></i></span>}
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {chat.map((msg, i) => (
                                        <div key={i} className={`flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-[10px] text-white ${msg.role === 'user' ? 'bg-slate-700' : 'bg-brand-600'}`}>
                                                <i className={`fa-solid ${msg.role === 'user' ? 'fa-user' : 'fa-robot'}`}></i>
                                            </div>
                                            <div className={`p-3 rounded-xl text-xs max-w-[85%] ${msg.role === 'user' ? 'bg-dark-700 text-white rounded-tr-none' : 'bg-dark-800 border border-dark-border text-slate-300 rounded-tl-none'}`}>
                                                {msg.content}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 bg-dark-800 border-t border-dark-border">
                                    <div className="flex bg-dark-900 border border-dark-border rounded-lg overflow-hidden focus-within:border-brand-500">
                                        <input type="text" value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyPress={e=>e.key==='Enter' && handleSendMessage()} className="flex-1 bg-transparent px-3 py-2 text-xs text-white outline-none" placeholder="Peça uma alteração..." disabled={agentStatus !== 'idle'} />
                                        <button onClick={handleSendMessage} disabled={agentStatus !== 'idle'} className="px-3 text-brand-400 hover:bg-dark-700"><i className="fa-solid fa-paper-plane"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* PAINEL CENTRAL: EDITOR E TERMINAL */}
                        <div className="flex-1 flex flex-col min-w-0">
                            <div className="h-10 bg-dark-900 border-b border-dark-border flex overflow-x-auto shrink-0 items-center px-4">
                                <span className="text-xs font-mono text-slate-300">{activeFile}</span>
                            </div>
                            <div className="flex-1 relative bg-[#0f111a]">
                                <textarea value={vfs[activeFile]} onChange={handleFileChange} spellCheck="false" className="absolute inset-0 w-full h-full bg-transparent text-emerald-400 font-mono text-[12px] p-4 outline-none resize-none editor-textarea"></textarea>
                                <button onClick={triggerRebuild} className="absolute bottom-4 right-4 bg-brand-600 hover:bg-brand-500 text-white px-3 py-1.5 rounded text-xs shadow-lg z-10"><i className="fa-solid fa-arrows-rotate mr-1"></i> RENDERIZAR</button>
                            </div>

                            <div className="h-40 bg-black border-t border-dark-border flex flex-col shrink-0">
                                <div className="px-4 py-1.5 bg-dark-800 flex justify-between items-center text-xs text-slate-400 font-mono">
                                    <span>TERMINAL</span>
                                    <div className="flex gap-3">
                                        <button onClick={triggerAutoCorrection} className="text-yellow-500 hover:text-yellow-400" title="Consertar Erros"><i className="fa-solid fa-wrench mr-1"></i> Autocorreção IA</button>
                                        <button onClick={()=>setTerminalLogs([])} className="hover:text-white"><i className="fa-solid fa-ban"></i></button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 font-mono text-[11px] space-y-1">
                                    {terminalLogs.map((log, i) => (
                                        <div key={i} className={`flex gap-2 ${log.type === 'error' ? 'text-red-400' : log.type === 'success' ? 'text-emerald-400' : 'text-slate-400'}`}>
                                            <span className="text-slate-600">[{log.time}]</span><span>{'>'} {log.msg}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* PAINEL DIREITO: PREVIEW */}
                        <div className="w-[400px] xl:w-[500px] bg-dark-800 border-l border-dark-border flex flex-col shrink-0">
                            <div className="h-10 border-b border-dark-border flex items-center justify-between px-3 bg-dark-900 shrink-0">
                                <span className="text-xs font-bold text-slate-300">LIVE PREVIEW</span>
                            </div>
                            <div className="flex-1 bg-dark-900 flex items-center justify-center p-2">
                                <div className="w-full h-full bg-white rounded shadow-2xl overflow-hidden border border-slate-700">
                                    <iframe key={previewKey} srcDoc={compiledHtml} className="w-full h-full border-0"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsView = () => {
            const { setCurrentRoute } = useContext(AppContext);
            return (
                <div className="flex-1 bg-dark-900 p-8">
                    <button onClick={() => setCurrentRoute('dashboard')} className="text-slate-400 hover:text-white mb-6"><i className="fa-solid fa-arrow-left mr-2"></i> Voltar</button>
                    <h1 className="text-2xl font-bold text-white mb-6">Configurações</h1>
                    <div className="bg-dark-800 border border-dark-border rounded-2xl p-6 max-w-2xl">
                        <h3 className="text-white font-bold mb-4">Credenciais</h3>
                        <p className="text-slate-400 text-xs mb-4">Insira seu Token do GitHub para habilitar exportação direta.</p>
                        <input type="password" placeholder="ghp_..." className="w-full bg-dark-900 border border-dark-border p-3 rounded text-sm text-white mb-4 outline-none" />
                        <Button>Salvar Integrações</Button>
                    </div>
                </div>
            );
        };

        // ==========================================
        // RAIZ
        // ==========================================
        const App = () => {
            const { currentRoute, user, toast } = useContext(AppContext);

            if (!user && currentRoute === 'login') return <><LoginView /><Toast toast={toast}/></>;
            if (!user) return null;

            return (
                <div className="flex h-screen w-full">
                    <Sidebar />
                    {currentRoute === 'dashboard' && <DashboardView />}
                    {currentRoute === 'ide' && <ProjectWorkspaceView />}
                    {currentRoute === 'settings' && <SettingsView />}
                    <Toast toast={toast} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><App /></AppProvider>);
    </script>
</body>
</html>
