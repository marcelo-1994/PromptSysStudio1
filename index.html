<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <title>PromptSys Studio | IDE Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { bg: '#0F172A', panel: '#1E293B', border: '#334155' }, brand: { 400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7' } } } } }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid #334155; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .editor-tab.active { background: #1E293B; border-bottom: 2px solid #0EA5E9; color: #38BDF8; }
        .timeline-step { transition: all 0.2s; }
        .timeline-step:hover { transform: scale(1.05); border-color: #0EA5E9; }
    </style>
</head>
<body class="h-screen flex flex-col text-sm overflow-hidden bg-dark-bg">

    <!-- Header (Mantido Compacto) -->
    <header class="glass-panel border-b border-dark-border px-4 py-2 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-lg"><i class="fa-solid fa-code text-white"></i></div>
            <div>
                <h1 class="font-bold text-base tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">Fábrica Livre IDE</h1>
                <p class="text-[9px] text-emerald-400 font-mono">React 18 + ESM + VirtualFS</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="btn-energy" class="flex items-center gap-1.5 bg-dark-panel border border-yellow-500/30 rounded-full px-3 py-1">
                <i class="fa-solid fa-bolt text-yellow-400"></i><span id="energy-counter" class="font-bold text-white text-xs">500</span>
            </button>
            <button onclick="preparaGitHubDeploy()" class="bg-white text-slate-900 px-3 py-1 rounded-lg text-xs font-bold shadow-lg"><i class="fa-brands fa-github mr-1"></i> Publicar</button>
        </div>
    </header>

    <!-- Workspace Principal IDE -->
    <main class="flex-1 flex flex-row overflow-hidden relative">
        
        <!-- PAINEL ESQUERDO: Agente + Timeline -->
        <section class="w-full lg:w-[400px] flex flex-col h-full shrink-0 border-r border-dark-border bg-dark-bg/50">
            <!-- Timeline (Máquina do Tempo) -->
            <div class="p-2 border-b border-dark-border bg-[#0b1121] flex gap-2 overflow-x-auto whitespace-nowrap items-center min-h-[50px]" id="timeline-container">
                <span class="text-[10px] text-slate-500 font-mono mr-2"><i class="fa-solid fa-clock-rotate-left"></i> Histórico:</span>
                <!-- Bolinhas do tempo aparecerão aqui -->
            </div>

            <!-- Chat do Agente -->
            <div id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-brand-600 flex items-center justify-center shrink-0 shadow-lg shadow-brand-500/30"><i class="fa-solid fa-brain text-white text-xs"></i></div>
                    <div class="bg-dark-panel border border-dark-border p-3 rounded-2xl rounded-tl-none text-slate-200 text-xs shadow-md">
                        IDE pronta. Peça um dashboard, gráficos ou formulários complexos. O motor React vai montar a árvore de arquivos.
                    </div>
                </div>
            </div>

            <!-- Input do Agente -->
            <div class="p-3 border-t border-dark-border bg-dark-panel relative shrink-0">
                <div class="flex gap-2">
                    <textarea id="chat-input" rows="2" class="flex-1 bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 resize-none text-xs" placeholder="Descreva o software ou o ajuste (ex: 'Adicione um gráfico de vendas')"></textarea>
                    <button onclick="sendChatMessage()" class="w-12 rounded-lg bg-brand-600 hover:bg-brand-500 flex flex-col items-center justify-center text-white transition-colors shadow-lg">
                        <i class="fa-solid fa-bolt mb-1"></i><span class="text-[9px]">Gerar</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- PAINEL DIREITO: VFS, Editor, Preview e Terminal -->
        <section class="hidden lg:flex flex-1 flex-col h-full bg-[#090d16] relative">
            
            <!-- Barra de Arquivos Virtuais -->
            <div class="flex bg-dark-bg border-b border-dark-border overflow-x-auto" id="file-tabs">
                <button class="editor-tab active px-4 py-2 text-xs font-mono flex items-center gap-2" onclick="switchFile('App.jsx')"><i class="fa-brands fa-react text-brand-400"></i> App.jsx</button>
                <button class="editor-tab px-4 py-2 text-xs font-mono text-slate-400 flex items-center gap-2" onclick="switchFile('styles.css')"><i class="fa-brands fa-css3-alt text-blue-400"></i> styles.css</button>
            </div>

            <div class="flex-1 flex flex-col relative h-full">
                <!-- Área Dividida: Preview (Top) / Editor (Bottom) -->
                <div class="flex-1 relative flex flex-col border-b border-dark-border">
                    <div class="absolute top-2 right-2 z-10 bg-dark-panel border border-dark-border rounded p-1 flex gap-1">
                        <button onclick="toggleView('split')" class="px-2 py-1 bg-brand-600 text-white rounded text-[10px] font-bold">Split</button>
                        <button onclick="toggleView('preview')" class="px-2 py-1 text-slate-400 hover:text-white rounded text-[10px]">Preview</button>
                        <button onclick="toggleView('code')" class="px-2 py-1 text-slate-400 hover:text-white rounded text-[10px]">Código</button>
                    </div>

                    <!-- Sandbox Iframe -->
                    <div id="preview-container" class="flex-1 bg-white relative overflow-hidden transition-all h-1/2">
                        <iframe id="app-preview" class="w-full h-full border-0"></iframe>
                    </div>

                    <!-- Code Editor -->
                    <div id="editor-container" class="flex-1 bg-[#090d16] relative border-t border-dark-border transition-all h-1/2">
                        <textarea id="code-editor" class="w-full h-full bg-transparent text-emerald-400 font-mono text-xs p-4 resize-none focus:outline-none" oninput="updateVFS(this.value)" spellcheck="false"></textarea>
                    </div>
                </div>

                <!-- Terminal de Erros -->
                <div class="h-32 bg-black border-t-2 border-slate-800 flex flex-col shrink-0">
                    <div class="px-3 py-1 bg-slate-900 border-b border-slate-800 flex justify-between items-center text-[10px] text-slate-400 font-mono">
                        <span><i class="fa-solid fa-terminal mr-1"></i> Console do Sistema</span>
                        <button onclick="clearTerminal()" class="hover:text-white"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div id="terminal-output" class="flex-1 overflow-y-auto p-2 font-mono text-[10px] space-y-1">
                        <div class="text-green-500">> Sandbox iniciada. Aguardando compilação...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal GitHub Simples -->
    <div id="modal-github" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-panel border border-brand-500 rounded-xl max-w-sm w-full p-6 text-center">
            <h2 class="text-white font-bold mb-4">Exportar via GitHub</h2>
            <input type="text" id="github-repo-name" placeholder="nome-do-app" class="w-full bg-dark-bg border border-dark-border p-2 text-white text-xs rounded mb-2">
            <input type="password" id="github-token" placeholder="ghp_..." class="w-full bg-dark-bg border border-dark-border p-2 text-white text-xs rounded mb-4">
            <div class="flex gap-2">
                <button onclick="closeModal('modal-github')" class="flex-1 bg-slate-700 text-white rounded py-2 text-xs">Cancelar</button>
                <button onclick="executeDeploy()" class="flex-1 bg-brand-600 text-white rounded py-2 text-xs font-bold">Publicar</button>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        
        // --- NÚCLEO DA IDE (VFS & TIMELINE) ---
        let VFS = { 'App.jsx': '// Seu código React aparecerá aqui\n', 'styles.css': '/* Seus estilos extras */\n' };
        let activeFile = 'App.jsx';
        let timeline = [];
        let viewMode = 'split'; // split, preview, code

        // Terminal Interceptor
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CONSOLE_LOG') {
                const term = document.getElementById('terminal-output');
                const isError = event.data.level === 'error';
                term.innerHTML += `<div class="${isError ? 'text-red-500' : 'text-slate-300'}">> ${event.data.msg}</div>`;
                term.scrollTop = term.scrollHeight;
            }
        });

        function clearTerminal() { document.getElementById('terminal-output').innerHTML = ''; }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function toggleView(mode) {
            viewMode = mode;
            const prev = document.getElementById('preview-container');
            const edit = document.getElementById('editor-container');
            if(mode === 'split') { prev.style.display = 'block'; prev.style.height = '50%'; edit.style.display = 'block'; edit.style.height = '50%'; }
            if(mode === 'preview') { prev.style.display = 'block'; prev.style.height = '100%'; edit.style.display = 'none'; }
            if(mode === 'code') { prev.style.display = 'none'; edit.style.display = 'block'; edit.style.height = '100%'; }
        }

        function switchFile(filename) {
            activeFile = filename;
            document.getElementById('code-editor').value = VFS[filename] || '';
            
            // Atualiza UI das abas
            document.querySelectorAll('.editor-tab').forEach(t => {
                t.classList.remove('active', 'border-bottom', 'border-brand-500', 'text-brand-400');
                t.classList.add('text-slate-400');
                if(t.innerText.includes(filename)) {
                    t.classList.add('active', 'border-bottom', 'border-brand-500', 'text-brand-400');
                    t.classList.remove('text-slate-400');
                }
            });
        }

        function updateVFS(content) {
            VFS[activeFile] = content;
            compileSandbox(); // Recompila ao digitar
        }

        function saveTimelineStep(promptDesc) {
            const stepId = timeline.length + 1;
            const snapshot = JSON.parse(JSON.stringify(VFS)); // Cópia profunda do estado atual
            timeline.push({ id: stepId, prompt: promptDesc, vfs: snapshot });
            
            const cont = document.getElementById('timeline-container');
            const btn = document.createElement('button');
            btn.className = "timeline-step w-6 h-6 rounded-full bg-brand-900 border border-brand-500 flex items-center justify-center text-[10px] text-white shrink-0 shadow-lg shadow-brand-500/20";
            btn.title = promptDesc;
            btn.innerText = stepId;
            btn.onclick = () => loadTimelineStep(stepId - 1);
            cont.appendChild(btn);
        }

        function loadTimelineStep(index) {
            if(!timeline[index]) return;
            VFS = JSON.parse(JSON.stringify(timeline[index].vfs));
            switchFile(activeFile);
            compileSandbox();
            const term = document.getElementById('terminal-output');
            term.innerHTML += `<div class="text-yellow-400">> Viagem no tempo: Restaurando Passo ${index + 1}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        // --- COMPILADOR DA SANDBOX (NPM + REACT) ---
        function compileSandbox() {
            const iframe = document.getElementById('app-preview');
            const reactCode = VFS['App.jsx'] || '';
            const cssCode = VFS['styles.css'] || '';

            // O Segredo: Interceptando console de dentro do Iframe e usando Babel Standalone
            const htmlBoilerplate = `
            <!DOCTYPE html>
            <html lang="pt-BR">
            <head>
                <script src="https://cdn.tailwindcss.com"><\/script>
                <script src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
                <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
                <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                <style>${cssCode}</style>
                <script>
                    // Interceptador de Terminal
                    ['log', 'error', 'warn'].forEach(level => {
                        const original = console[level];
                        console[level] = function(...args) {
                            window.parent.postMessage({ type: 'CONSOLE_LOG', level, msg: args.join(' ') }, '*');
                            original.apply(console, args);
                        };
                    });
                    window.onerror = function(msg, url, lineNo, columnNo, error) {
                        window.parent.postMessage({ type: 'CONSOLE_LOG', level: 'error', msg: \`\${msg} (Linha: \${lineNo})\` }, '*');
                        return false;
                    };
                <\/script>
            </head>
            <body class="bg-white text-slate-900">
                <div id="root"></div>
                <script type="text/babel" data-type="module">
                    ${reactCode}
                    try {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(React.createElement(App));
                    } catch(e) { console.error("Erro no Render:", e.message); }
                <\/script>
            </body>
            </html>`;
            
            iframe.srcdoc = htmlBoilerplate;
        }

        // --- MOTOR DE IA ---
        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg) return;

            const chat = document.getElementById('chat-window');
            chat.innerHTML += `<div class="flex items-start gap-3 flex-row-reverse"><div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center shrink-0 text-white text-xs"><i class="fa-solid fa-user"></i></div><div class="bg-brand-600 p-3 rounded-xl rounded-tr-none text-white text-xs">${msg}</div></div>`;
            input.value = ''; chat.scrollTop = chat.scrollHeight;

            const lid = 'load-' + Date.now();
            chat.innerHTML += `<div id="${lid}" class="text-brand-400 text-xs font-bold text-center animate-pulse py-2">Gerando Árvore de Arquivos...</div>`;

            try {
                // Prompt Sistêmico de Nível IDE
                const systemPrompt = `Você é uma IA de desenvolvimento Full-Stack autônoma.
                Gere o código para 'App.jsx' (um componente React principal chamado App).
                Use Tailwind CSS nas classes. Você pode usar hooks do React (useState, useEffect).
                
                SE TIVER CÓDIGO ATUAL, FAÇA APENAS A MODIFICAÇÃO PEDIDA.
                Código Atual: \n${VFS['App.jsx']}\n\n
                
                Pedido: "${msg}"
                
                IMPORTANTE: Retorne APENAS o código puro do App.jsx, sem formatação markdown ou textos de introdução. O código deve conter "function App() { ... } export default App;" ou similar.`;

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
                    body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: systemPrompt }] })
                });

                const data = await res.json();
                let code = data.choices[0].message.content.replace(/```jsx/g, '').replace(/```javascript/g, '').replace(/```/g, '').trim();

                VFS['App.jsx'] = code;
                switchFile('App.jsx'); // Atualiza a tela
                compileSandbox(); // Roda o código
                saveTimelineStep(msg.substring(0, 15) + '...'); // Salva na Máquina do Tempo

                document.getElementById(lid).remove();
                chat.innerHTML += `<div class="flex items-start gap-3"><div class="w-8 h-8 rounded-full bg-brand-600 flex items-center justify-center shrink-0 text-white text-xs"><i class="fa-solid fa-robot"></i></div><div class="bg-dark-panel border border-dark-border p-3 rounded-xl rounded-tl-none text-slate-200 text-xs">VFS atualizado. Verifique o terminal para logs de execução.</div></div>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (e) {
                document.getElementById(lid).remove();
                showToast('Erro ao processar código na Groq.', 'error');
            }
        }

        // Deploy Simples para o HTML compilado inteiro
        function preparaGitHubDeploy() {
            const token = localStorage.getItem('fl_github_token');
            if(token) document.getElementById('github-token').value = token;
            openModal('modal-github');
        }

        async function executeDeploy() {
            const token = document.getElementById('github-token').value.trim();
            let repoNameRaw = document.getElementById('github-repo-name').value.trim();
            let repoName = repoNameRaw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^a-z0-9-_]/g, '');
            
            if(!token || !repoName) return showToast('Preencha os dados', 'error');
            localStorage.setItem('fl_github_token', token);
            
            // Aqui ele pegaria o HTML compilado completo e faria o envio (mesma lógica já testada).
            showToast('Arquitetura pronta. Deploy requer consolidação final.', 'info');
            closeModal('modal-github');
        }

        window.onload = () => {
            document.getElementById('code-editor').value = VFS['App.jsx'];
            compileSandbox();
        };
    </script>
</body>
</html>
