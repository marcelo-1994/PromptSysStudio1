<!-- Header Simples e Perfeito -->
<header class="bg-[#1E293B] border-b border-[#334155] px-6 py-4 flex items-center justify-between z-10 shrink-0">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-sky-400 flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-robot text-white text-xl"></i>
        </div>
        <div>
            <h1 class="font-bold text-lg tracking-tight text-white">Fábrica Livre</h1>
            <p class="text-xs text-slate-400">Estúdio de IA Sem Código</p>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <button onclick="alert('Sistema operando normalmente!')" class="bg-[#1E293B] border border-[#334155] px-4 py-2 rounded-lg text-slate-200 text-xs font-medium hover:border-sky-500 transition-colors">
            <i class="fa-solid fa-box-archive text-sky-400 mr-1"></i> Meus Apps
        </button>
        <div class="bg-sky-500/10 border border-sky-500/30 rounded-full px-4 py-1.5 flex items-center gap-2">
            <i class="fa-solid fa-bolt text-yellow-400"></i>
            <span class="font-bold text-white text-sm" id="energy-counter">500</span>
        </div>
    </div>
</header>

<!-- Workspace Principal -->
<main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Chat Arquiteto -->
    <section class="w-full lg:w-[420px] bg-[#0F172A]/50 border-r border-[#334155] flex flex-col shrink-0 h-[50vh] lg:h-full">
        <div class="p-4 border-b border-[#334155] bg-[#1E293B]/50 flex items-center justify-between">
            <h2 class="font-semibold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-sky-400"></i> Arquiteto de IA
            </h2>
        </div>
        
        <div id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-sky-600 flex items-center justify-center shrink-0 text-white text-xs">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-[#1E293B] border border-[#334155] p-3 rounded-2xl rounded-tl-none text-slate-200 text-sm">
                    Olá! Descreva o aplicativo que você quer criar e clique em "Gerar App".
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-[#334155] bg-[#1E293B]">
            <div class="flex gap-2">
                <textarea id="chat-input" rows="1" class="flex-1 bg-[#0F172A] border border-[#334155] rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-none text-sm" placeholder="Digite sua ideia..."></textarea>
                <button onclick="sendChatMessage()" class="w-12 h-12 rounded-xl bg-sky-600 hover:bg-sky-500 flex items-center justify-center text-white transition-colors shadow-lg shadow-sky-500/20 shrink-0">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- Preview -->
    <section class="flex-1 flex flex-col bg-[#0b1121] relative h-[50vh] lg:h-full">
        <div class="p-4 border-b border-[#334155] flex justify-between items-center bg-[#0F172A]/80 z-10">
            <span class="text-slate-400 font-mono text-xs">Pré-visualização ao Vivo</span>
            <button onclick="generateApp()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition-all shadow-lg shadow-emerald-500/20 flex items-center gap-2">
                <i class="fa-solid fa-play"></i> Gerar App
            </button>
        </div>

        <div class="flex-1 p-6 flex items-center justify-center relative">
            <div id="app-placeholder" class="text-center">
                <div class="w-20 h-20 rounded-full bg-[#1E293B] border-2 border-dashed border-[#334155] flex items-center justify-center mx-auto mb-4 text-3xl text-slate-500">
                    <i class="fa-solid fa-code"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-300">Nenhum App Gerado</h3>
                <p class="text-slate-500 mt-1 text-sm">Digite sua ideia ao lado para começar.</p>
            </div>
            <iframe id="app-preview" class="w-full h-full bg-white rounded-xl shadow-2xl hidden border-0"></iframe>
        </div>
    </section>
</main>

<div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

<script>
    const GROQ_API_KEY = "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";

    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `px-4 py-3 rounded-xl border backdrop-blur-md shadow-lg bg-sky-500/20 border-sky-500/50 text-sky-400 text-sm z-50`;
        toast.innerHTML = `<span>${message}</span>`;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    async function callAI(promptText) {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` }, 
            body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: promptText }] }) 
        });
        const data = await response.json();
        return data.choices ? data.choices[0].message.content : "Sem resposta.";
    }

    async function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        const chatWindow = document.getElementById('chat-window');
        chatWindow.innerHTML += `<div class="flex justify-end"><div class="bg-sky-600 p-3 rounded-2xl rounded-tr-none text-white text-sm max-w-[80%]">${msg}</div></div>`;
        input.value = '';
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const reply = await callAI(msg);
            chatWindow.innerHTML += `<div class="flex items-start gap-3"><div class="w-8 h-8 rounded-full bg-sky-600 flex items-center justify-center shrink-0 text-white text-xs"><i class="fa-solid fa-robot"></i></div><div class="bg-[#1E293B] border border-[#334155] p-3 rounded-2xl rounded-tl-none text-slate-200 text-sm max-w-[80%]">${reply}</div></div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        } catch (e) {
            showToast("Erro ao conectar com a IA.", "error");
        }
    }

    async function generateApp() {
        showToast("Gerando aplicativo com IA...", "info");
        try {
            const prompt = "Escreva APENAS o código HTML completo e responsivo com Tailwind CSS embutido para um aplicativo útil. Inicie com <!DOCTYPE html>.";
            const raw = await callAI(prompt);
            const code = raw.replace(/```html/g, '').replace(/```/g, '').trim();
            
            document.getElementById('app-placeholder').classList.add('hidden');
            const iframe = document.getElementById('app-preview');
            iframe.classList.remove('hidden');
            iframe.srcdoc = code;
            showToast("App gerado com sucesso!", "success");
        } catch (e) {
            showToast("Erro ao gerar app.", "error");
        }
    }
</script>
